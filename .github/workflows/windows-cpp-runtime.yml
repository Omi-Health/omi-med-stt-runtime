name: windows cpp runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/omi_stt/cpp_runtime.py"
      - "src/omi_stt/resources/parakeet-cpp-omi-adapter.patch"
      - "parakeet-cpp-omi-adapter.patch"
      - ".github/workflows/windows-cpp-runtime.yml"

jobs:
  build-windows-cpu:
    name: build patched parakeet.cpp DLL
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Build patched Windows CPU runtime
        shell: pwsh
        env:
          OMI_MED_STT_CACHE: ${{ runner.temp }}\omi-med-stt-cache
          OMI_MED_STT_GGML_NATIVE: "OFF"
        run: |
          omi-med-stt install-cpp --cpp-backend cpu --json

      - name: Verify Windows C API exports
        shell: pwsh
        env:
          OMI_MED_STT_CACHE: ${{ runner.temp }}\omi-med-stt-cache
          OMI_MED_STT_CPP_THREADS: "4"
        run: |
          @'
          import ctypes
          import json
          import os
          from omi_stt.cpp_runtime import _cached_parakeet_lib, _windows_dll_directories

          lib_path = _cached_parakeet_lib("cpu")
          dll_handles = [os.add_dll_directory(str(path)) for path in _windows_dll_directories(lib_path, "cpu")]
          lib = ctypes.CDLL(str(lib_path))
          required = [
              "parakeet_capi_load",
              "parakeet_capi_free",
              "parakeet_capi_transcribe_pcm",
              "parakeet_capi_transcribe_pcm_batch",
              "parakeet_capi_set_num_threads",
          ]
          missing = [name for name in required if not hasattr(lib, name)]
          if missing:
              raise SystemExit(f"Missing C API exports: {missing}")
          print(json.dumps({"libparakeet": str(lib_path), "exports": required}, indent=2))
          '@ | python -

      - name: Upload Windows CPU runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: omi-med-stt-parakeet-cpp-windows-cpu
          path: ${{ runner.temp }}\omi-med-stt-cache\parakeet.cpp\**\*.dll
          if-no-files-found: error
